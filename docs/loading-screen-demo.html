<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Loader — Win Win Car Audio</title>
<!-- Same font stack as the live site (layouts/app.blade.php) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,700&display=swap" rel="stylesheet">
<style>
    /*
     * Standalone replica of resources/views/components/page-loader.blade.php
     * for report screenshots. Visual parameters copied 1:1 from the component.
     *
     * Keys: [Space] pause/resume · [1]/[2]/[3] caption EN/MS/ZH · [T] light/dark brand tokens
     */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
        /* dark-mode tokens (the overlay is dark, so this is the default look) */
        --brand-red: #E86460;   /* Ember Light — text-brand-red in dark mode */
        --ghost: #9CA3AF;       /* gray-400 — car outline in dark mode */
    }
    body.light-tokens {
        --brand-red: #C8413D;   /* Ember Red — text-brand-red in light mode */
        --ghost: #4B5563;       /* gray-600 — car outline in light mode */
    }

    body {
        /* bg-[#0C0C0E]/95 over the page; standalone → solid */
        background: #0C0C0E;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: 'DM Sans', ui-sans-serif, system-ui, sans-serif;
        overflow: hidden;
    }

    /* w-[min(72vmin,240px)] aspect-[1.5] mb-6 */
    .stage {
        width: min(72vmin, 240px);
        aspect-ratio: 3 / 2;
        display: grid;
        place-items: center;
        margin-bottom: 1.5rem;
        position: relative;
    }
    .stage svg { width: 100%; height: 100%; overflow: visible; }

    /* text-xl font-bold text-brand-red tracking-wide animate-pulse */
    .caption {
        font-size: 1.25rem;
        line-height: 1.75rem;
        font-weight: 700;
        letter-spacing: 0.025em;
        color: var(--brand-red);
        text-align: center;
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse {
        0%, 100% { opacity: 1; }
        50%      { opacity: .5; }
    }
    body.paused .caption { animation-play-state: paused; }
</style>
</head>
<body>
    <div class="stage">
        <svg viewBox="0 0 300 150" fill="none" aria-hidden="true">
            <g id="group">
                <path id="path"
                      d="M 50 100
                         C 30 100, 20 90, 20 80
                         L 20 70
                         C 20 50, 40 40, 60 40
                         L 90 35
                         C 120 20, 150 15, 180 20
                         L 230 40
                         C 260 45, 275 55, 280 75
                         C 285 95, 270 100, 250 100
                         L 220 100
                         A 25 25 0 0 0 170 100
                         L 130 100
                         A 25 25 0 0 0 80 100
                         Z"
                      stroke="var(--ghost)"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="5"
                      opacity="0.05">
                </path>
            </g>
        </svg>
    </div>
    <h2 class="caption" id="caption">Loading...</h2>

<script>
    // Config — identical to carLoader() in page-loader.blade.php
    const particleCount = 50;
    const trailSpan = 0.4;
    const durationMs = 3000;

    const path = document.getElementById('path');
    const group = document.getElementById('group');
    const totalLength = path.getTotalLength();

    const SVG_NS = 'http://www.w3.org/2000/svg';
    const particleNodes = [];
    for (let i = 0; i < particleCount; i++) {
        const circle = document.createElementNS(SVG_NS, 'circle');
        circle.setAttribute('fill', '#E11D48');
        group.appendChild(circle);
        particleNodes.push(circle);
    }

    const normalizeProgress = p => ((p % 1) + 1) % 1;
    const getPointAt = p => path.getPointAtLength(p * totalLength);

    function getParticleData(index, progress) {
        const tailOffset = index / (particleCount - 1);
        const point = getPointAt(normalizeProgress(progress - tailOffset * trailSpan));
        const fade = Math.pow(1 - tailOffset, 0.6);
        return {
            x: point.x,
            y: point.y,
            radius: 1 + fade * 3.5,
            opacity: 0.05 + fade * 0.95,
        };
    }

    let startedAt = null;
    let paused = false;
    let pausedAt = 0;

    function render(now) {
        if (!startedAt) startedAt = now;
        if (!paused) {
            const progress = ((now - startedAt) % durationMs) / durationMs;
            particleNodes.forEach((node, index) => {
                const pt = getParticleData(index, progress);
                node.setAttribute('cx', pt.x.toFixed(2));
                node.setAttribute('cy', pt.y.toFixed(2));
                node.setAttribute('r', pt.radius.toFixed(2));
                node.setAttribute('opacity', pt.opacity.toFixed(3));
            });
        }
        requestAnimationFrame(render);
    }
    requestAnimationFrame(render);

    // Screenshot helpers (no visible chrome):
    //   Space — freeze/resume the particle trail
    //   1 / 2 / 3 — caption in EN / MS / ZH (same strings as lang/*.json)
    //   T — swap between dark-mode and light-mode brand tokens
    const captions = { '1': 'Loading...', '2': 'Sedang dimuatkan...', '3': '加载中...' };
    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
            e.preventDefault();
            if (!paused) { pausedAt = performance.now(); }
            else { startedAt += performance.now() - pausedAt; }
            paused = !paused;
            document.body.classList.toggle('paused', paused);
        } else if (captions[e.key]) {
            document.getElementById('caption').textContent = captions[e.key];
        } else if (e.key.toLowerCase() === 't') {
            document.body.classList.toggle('light-tokens');
        }
    });
</script>
</body>
</html>
