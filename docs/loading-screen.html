<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Win Win Car Audio — Page Loading Screen</title>
<style>
  :root { color-scheme: light dark; }
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }

  /* The page that sits behind the loader (just to show the loader is an overlay). */
  body { background: #F7F5F3; }
  html.dark body { background: #121212; }

  /* The loading overlay. Theme-aware: light background in light mode, near-black in
     dark mode. (This is the fix — the background used to be hard-coded dark, which
     looked wrong when the site was in light mode.) */
  .loader {
    position: fixed; inset: 0; z-index: 99999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(12px);
  }
  html.dark .loader { background: rgba(12, 12, 14, 0.95); }

  .loader-art { width: min(72vmin, 240px); aspect-ratio: 1.5 / 1; margin-bottom: 1.5rem; }
  .loader-art svg { width: 100%; height: 100%; overflow: visible; }

  /* Faint guide outline of the car; the animated particles trace over it. */
  .car-path { stroke: #9CA3AF; opacity: 0.08; }
  html.dark .car-path { stroke: #6B7280; }

  .loader-text {
    font-size: 1.25rem; font-weight: 700; letter-spacing: 0.05em;
    color: #E11D48; animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

  .theme-toggle {
    position: fixed; top: 1rem; right: 1rem; z-index: 100000; cursor: pointer;
    border: 1px solid rgba(128, 128, 128, 0.4); border-radius: 999px;
    padding: 0.5rem 1rem; font-size: 0.85rem;
    background: rgba(128, 128, 128, 0.15); color: inherit;
  }
</style>
</head>
<body>
  <!-- Screenshot helper: not part of the loader itself. -->
  <button class="theme-toggle" onclick="document.documentElement.classList.toggle('dark')">Toggle light / dark</button>

  <div class="loader" role="status" aria-live="polite">
    <div class="loader-art">
      <svg viewBox="0 0 300 150" fill="none" aria-hidden="true">
        <g id="car-group">
          <path id="car-path" class="car-path"
                d="M 50 100 C 30 100, 20 90, 20 80 L 20 70 C 20 50, 40 40, 60 40 L 90 35
                   C 120 20, 150 15, 180 20 L 230 40 C 260 45, 275 55, 280 75
                   C 285 95, 270 100, 250 100 L 220 100 A 25 25 0 0 0 170 100
                   L 130 100 A 25 25 0 0 0 80 100 Z"
                stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="5"></path>
          <!-- Particles are injected here by the script. -->
        </g>
      </svg>
    </div>

    <!-- Caption ships all three languages and picks the right one from <html lang>,
         so it is always shown in the customer's current language. -->
    <h2 class="loader-text" id="loader-text"
        data-en="Loading..." data-ms="Sedang dimuatkan..." data-zh="加载中...">Loading...</h2>
  </div>

  <script>
    // ── Particle "car" loader — a self-contained port of the site's Alpine component.
    const path  = document.getElementById('car-path');
    const group = document.getElementById('car-group');
    const SVG_NS = 'http://www.w3.org/2000/svg';
    const PARTICLE_COUNT = 50, TRAIL_SPAN = 0.4, DURATION_MS = 3000;
    const totalLength = path.getTotalLength();

    const particles = [];
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const dot = document.createElementNS(SVG_NS, 'circle');
      dot.setAttribute('fill', '#E11D48');   // brand red
      group.appendChild(dot);
      particles.push(dot);
    }

    const normalise = p => ((p % 1) + 1) % 1;
    const pointAt   = p => path.getPointAtLength(normalise(p) * totalLength);

    let startedAt = null;
    function frame(now) {
      if (!startedAt) startedAt = now;
      const progress = ((now - startedAt) % DURATION_MS) / DURATION_MS;

      particles.forEach((dot, i) => {
        const tailOffset = i / (PARTICLE_COUNT - 1);
        const pt   = pointAt(progress - tailOffset * TRAIL_SPAN);
        const fade = Math.pow(1 - tailOffset, 0.6);
        dot.setAttribute('cx', pt.x.toFixed(2));
        dot.setAttribute('cy', pt.y.toFixed(2));
        dot.setAttribute('r', (1 + fade * 3.5).toFixed(2));
        dot.setAttribute('opacity', (0.05 + fade * 0.95).toFixed(3));
      });

      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    // Caption follows the active language (matches the real loader's i18n behaviour).
    (function syncLang() {
      const el = document.getElementById('loader-text');
      const lang = (document.documentElement.lang || 'en').slice(0, 2).toLowerCase();
      const text = el.getAttribute('data-' + lang);
      if (text) el.textContent = text;
    })();
  </script>
</body>
</html>
